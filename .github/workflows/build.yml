name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.SUDOKU_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests del motor
        run: ./gradlew :core:test
      - name: Compilar APK de pruebas
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sudoku-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Bundle para Google Play. Se firma solo si existe el secreto SUDOKU_KEYSTORE_BASE64.
      - name: Preparar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SUDOKU_KEYSTORE_BASE64 }}
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          echo "SUDOKU_KEYSTORE_FILE=release.jks" >> "$GITHUB_ENV"
      - name: Compilar bundle de release (AAB)
        env:
          SUDOKU_KEYSTORE_PASSWORD: ${{ secrets.SUDOKU_KEYSTORE_PASSWORD }}
          SUDOKU_KEY_ALIAS: ${{ secrets.SUDOKU_KEY_ALIAS }}
          SUDOKU_KEY_PASSWORD: ${{ secrets.SUDOKU_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: sudoku-release-aab
          path: app/build/outputs/bundle/release/*.aab

  # Capturas para Google Play (Paparazzi renderiza las pantallas reales en la JVM).
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Generar capturas
        run: ./gradlew :app:recordPaparazziDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sudoku-screenshots
          path: app/src/test/snapshots/images/*.png

  # Publica el APK en la Release "ultima" para instalarlo directamente en el móvil.
  publish-apk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sudoku-debug-apk
      - name: Publicar en la Release "ultima"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv *.apk sudoku.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima sudoku.apk --target "$GITHUB_SHA" --title "Última versión" \
            --notes "APK para instalar en el móvil. Ver docs/instalar.md."
